services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qa-pilot-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_pilot_rag
      POSTGRES_PASSWORD: qa_pilot_rag
      POSTGRES_DB: qa_pilot_rag
    ports:
      - "5434:5432"
    volumes:
      - qa-pilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_pilot_rag -d qa_pilot_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qa-pilot-postgres-data:
